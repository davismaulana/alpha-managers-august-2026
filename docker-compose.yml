services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - LEAD_WEBHOOK_URL=${LEAD_WEBHOOK_URL:-}
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.autopilot-business-august2026.rule=Host(`alpha-managers-august-2026-preview.zenova.id`)"
      - "traefik.http.routers.autopilot-business-august2026.entrypoints=websecure"
      - "traefik.http.services.autopilot-business-august2026-service.loadbalancer.server.port=80"
      - "traefik.http.routers.autopilot-business-august2026.service=autopilot-business-august2026-service"
      - "traefik.http.routers.autopilot-business-august2026.tls=true"

networks:
  dokploy-network:
    external: true
