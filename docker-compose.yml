services:
  # Dokploy domain binding for august-zenith.zenova.id targets this service name.
  august-zenith-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

networks:
  dokploy-network:
    external: true
